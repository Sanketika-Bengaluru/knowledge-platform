version: "3.0"
services:
  sunbird-yugabyte:
    image: yugabytedb/yugabyte:latest
    container_name: "sunbird_yugabyte"
    ports:
      - 7000:7000  # YB-Master RPC
      - 9000:9000  # YB-Master Admin UI
      - 9042:9042  # YCQL (Cassandra-compatible)
      - 5433:5433  # YSQL (PostgreSQL-compatible)
      - 12000:12000  # YB-TServer Admin UI
    command: >
      bash -c "
      bin/yugabyted start
      --advertise_address=127.0.0.1
      --base_dir=/var/ybdata
      --daemon=false
      "
    volumes:
      - $sunbird_dbs_path/yugabyte/data:/var/ybdata
    environment:
      - YCQL_PASSWORD=password
      - YSQL_PASSWORD=password

  sunbird-cassandra:
    image: cassandra:3.11.11
    container_name: "sunbird_cassandra"
    ports:
      - 9043:9042  # Changed to 9043 to avoid conflict with Yugabyte YCQL
    depends_on:
      - sunbird-yugabyte
    volumes:
      - $sunbird_dbs_path/cassandra/data:/var/lib/cassandra
      - $sunbird_dbs_path/cassandra/logs:/opt/cassandra/logs
      - $sunbird_dbs_path/cassandra/backups:/mnt/backups

  sunbird-redis: 
    image: redis:6.0.8
    container_name: "sunbird_redis"
    ports:
      - 6379:6379
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
     - $sunbird_dbs_path/redis/redis.conf:/usr/local/etc/redis/redis.conf

  zookeeper:
    image: 'wurstmeister/zookeeper:latest'
    container_name: zookeeper
    ports:
      - "2181:2181"    
    environment:
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:2181     
    
  kafka:
    image: 'wurstmeister/kafka:2.12-2.5.1'
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181      
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper  